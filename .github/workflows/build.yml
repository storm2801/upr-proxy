name: Build APK

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK release firmado
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restaurar keystore desde secretos
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upr-proxy.jks
          ls -la upr-proxy.jks

      - name: Crear keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOP
          storeFile=../upr-proxy.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOP

      - name: Compilar APK release
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK con la versión
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "UPRProxy-${VERSION}-release.apk"
          ls -lh "UPRProxy-${VERSION}-release.apk"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: UPRProxy-${{ steps.apk.outputs.VERSION }}-release
          path: UPRProxy-*.apk
          retention-days: 90

      - name: Crear Release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: UPRProxy-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Actualizar version.json (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          APK_URL="https://github.com/storm2801/upr-proxy/releases/download/${TAG_NAME}/UPRProxy-${VERSION_NAME}-release.apk"

          # Changelog: extraer la sección de esta versión del CHANGELOG.md
          CHANGELOG="Nueva versión ${VERSION_NAME} disponible. Consulta el CHANGELOG para más detalles."

          cat > /tmp/version.json <<EOJ
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "${APK_URL}",
            "changelog": "${CHANGELOG}",
            "mandatory": false,
            "publishedAt": "$(date +%Y-%m-%d)"
          }
          EOJ

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull origin main
          cp /tmp/version.json version.json
          git add version.json
          git diff --cached --quiet && echo "Sin cambios en version.json" || \
            git commit -m "chore: actualizar version.json a ${VERSION_NAME}"
          git push origin main || echo "No se pudo pushear (probablemente sin cambios)"
